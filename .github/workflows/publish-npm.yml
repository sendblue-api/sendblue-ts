# This workflow is dispatched by release-please.yml on the new tag after a release PR is merged
# (a release created with GITHUB_TOKEN does not fire `release: published`).
# It also runs when a release is published by a user, and it can be run manually to re-publish
# to NPM in case it failed for some reason. Run it on the release tag (e.g. `v3.18.0`).
# You can run this workflow by navigating to https://www.github.com/sendblue-api/sendblue-ts/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: The path to run the release in, e.g. '.' or 'packages/mcp-server'. Leave empty to publish both.
        required: false
      tag:
        description: Release tag to upload the MCP bundle to, e.g. 'v3.18.0'. Defaults to the ref when run on a tag.
        required: false

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          yarn install

      - name: Publish to NPM
        run: |
          if [ -n "$INPUT_PATH" ]; then
            PATHS_RELEASED="$(jq -nc --arg p "$INPUT_PATH" '[$p]')"
          else
            PATHS_RELEASED='[".","packages/mcp-server"]'
          fi
          yarn tsn scripts/publish-packages.ts "$(jq -nc --arg p "$PATHS_RELEASED" '{paths_released: $p}')"
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}

      - name: Upload MCP Server DXT GitHub release asset
        run: |
          TAG="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [ -z "$TAG" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag (not a release event, no tag input, not run on a tag): skipping upload"
            exit 0
          fi
          gh release upload "$TAG" packages/mcp-server/sendblue_api.mcpb --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
